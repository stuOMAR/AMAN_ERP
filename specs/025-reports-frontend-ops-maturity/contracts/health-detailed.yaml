openapi: 3.1.0
info:
  title: Health Detailed (R7)
  version: "1.0.0"
paths:
  /health/detailed:
    get:
      summary: Aggregate health for every adapter (db, redis, worker, zatca, notifications, dms, clamav, fx, search)
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                type: object
                required: [status, adapters]
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  adapters:
                    type: object
                    additionalProperties:
                      type: object
                      required: [status, latency_ms]
                      properties:
                        status: { type: string, enum: [ok, degraded, down] }
                        latency_ms: { type: integer }
                        last_success_at: { type: string, format: date-time, nullable: true }
                        last_error: { type: string, nullable: true }
        "503":
          description: One or more critical adapters down
