openapi: 3.1.0
info:
  title: Ops Scheduler Monitoring (R8)
  version: "1.0.0"
paths:
  /ops/scheduler/jobs:
    get:
      summary: List scheduled jobs with status
      security: [{ sensitive_permission: ["ops.scheduler.admin"] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [job_id, last_run, next_run, status]
                  properties:
                    job_id: { type: string }
                    last_run: { type: string, format: date-time, nullable: true }
                    next_run: { type: string, format: date-time, nullable: true }
                    status: { type: string, enum: [idle, running, succeeded, failed, idempotent_skip] }
                    last_error: { type: string, nullable: true }
                    misfire_grace_time: { type: integer, nullable: true }
  /ops/scheduler/jobs/{job_id}/run-now:
    post:
      summary: Manually trigger a scheduled job (audited)
      security: [{ sensitive_permission: ["ops.scheduler.admin"] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Triggered
          content:
            application/json:
              schema:
                type: object
                required: [run_id, attempt]
                properties:
                  run_id: { type: string }
                  attempt: { type: integer }
        "409":
          description: Already running
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: object, properties: { code: { type: string, example: scheduler.already_running } } }
components:
  securitySchemes:
    sensitive_permission: { type: apiKey, in: header, name: Authorization }
