openapi: 3.1.0
info:
  title: Ops Restore (R8)
  version: "1.0.0"
paths:
  /ops/backups:
    get:
      summary: List recent backup runs
      security: [{ sensitive_permission: ["ops.restore"] }]
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [backup_id, started_at, status]
                  properties:
                    backup_id: { type: string }
                    started_at: { type: string, format: date-time }
                    finished_at: { type: string, format: date-time, nullable: true }
                    size_bytes: { type: integer, nullable: true }
                    checksum: { type: string, nullable: true }
                    offsite_uri: { type: string, nullable: true }
                    status: { type: string, enum: [running, succeeded, failed, offsite_failed] }
  /ops/restore/dry-run:
    post:
      summary: Validate a backup and report what restoring it would change
      security: [{ sensitive_permission: ["ops.restore"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_id]
              properties:
                backup_id: { type: string }
      responses:
        "200":
          description: Dry-run report
          content:
            application/json:
              schema:
                type: object
                required: [backup_id, checksum_ok, missing_tenants, extra_tenants, confirm_token]
                properties:
                  backup_id: { type: string }
                  checksum_ok: { type: boolean }
                  missing_tenants: { type: array, items: { type: string } }
                  extra_tenants: { type: array, items: { type: string } }
                  confirm_token:
                    type: string
                    description: HMAC-signed token (claims: action=ops.restore, backup_id, actor_id, exp). Use in /ops/restore.
  /ops/restore:
    post:
      summary: Execute a restore (requires confirm token from /ops/restore/dry-run)
      security: [{ sensitive_permission: ["ops.restore"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_id, confirm_token]
              properties:
                backup_id: { type: string }
                confirm_token: { type: string }
                include_new_tenants_empty: { type: boolean, default: false }
      responses:
        "202":
          description: Restore started
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: object, properties: { code: { type: string, example: auth.token_invalid } } }
components:
  securitySchemes:
    sensitive_permission: { type: apiKey, in: header, name: Authorization }
